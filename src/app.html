<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<title>TV Streamy</title>
<style>/*@@FONTS@@*/#nextep{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:160;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card,#1b1b20);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#nextep div{flex:1 1 180px;display:flex;flex-direction:column;gap:2px}#nextep small{color:var(--muted)}
.boot{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:bootin .35s ease-out}
.boot svg{width:112px;height:112px;filter:drop-shadow(0 12px 30px rgba(229,9,20,.35))}.boot b{font-family:var(--display);font-size:1.7rem;font-weight:800;letter-spacing:-.02em}.boot .spin{margin-top:10px;opacity:0;animation:spin 1s linear infinite,fadein .3s .9s forwards}@keyframes fadein{to{opacity:1}}
@keyframes bootin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.epdl.prog{background:linear-gradient(90deg,rgba(229,9,20,.55) var(--pc),var(--surface2) var(--pc));font-size:.78rem;font-weight:700;min-width:56px}
.chlist .ch .star svg{width:20px;height:20px}
.gwrap{overflow-x:auto;overflow-y:visible;border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch;margin-top:10px}
.ginner{position:relative}
.gruler{position:sticky;top:0;height:28px;border-bottom:1px solid var(--line);z-index:2;background:var(--surface)}
.gh{position:absolute;top:6px;font-size:.75rem;color:var(--muted);padding-left:4px;border-left:1px solid var(--line)}
.grow{position:relative;height:58px;border-bottom:1px solid var(--line)}
.grow .glab{position:sticky;left:0;z-index:1;width:112px;height:58px;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.78rem;font-weight:700;text-align:left}
.gruler .glab{position:sticky;left:0;display:block;width:112px;height:27px;background:var(--surface);z-index:3}
.grow .glab img{width:28px;height:28px;object-fit:contain;flex:none}.grow .glab span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gline{position:absolute;left:112px;top:0;right:0;height:58px}
.gblk{position:absolute;top:5px;height:48px;border:0;border-radius:8px;background:var(--surface2);color:var(--ink);text-align:left;padding:5px 8px;clip-path:inset(0 round 8px);display:flex;flex-direction:column;justify-content:center;font-size:.78rem;white-space:nowrap}
.gblk b,.gblk small{position:sticky;left:120px;align-self:flex-start;width:fit-content;max-width:100%;overflow:hidden;text-overflow:ellipsis}.gblk small{color:var(--muted);font-size:.7rem}
.gblk svg{position:absolute;right:5px;top:5px;width:14px;height:14px;color:var(--accent2)}
.gblk.now{box-shadow:inset 0 0 0 2px var(--accent);background:rgba(229,9,20,.18)}.gblk.old{opacity:.45}.gblk:focus-visible{outline:3px solid #fff}
.gnowline{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:1;pointer-events:none}
.gwait{position:absolute;left:12px;top:20px;font-size:.75rem;color:var(--muted)}
.chlogo{width:48px;height:48px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;font-weight:800}.chlogo img{width:100%;height:100%;object-fit:contain}
.gl{display:flex;flex-direction:column;margin-top:10px}
.gp{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.gp .gt{font-weight:800;font-variant-numeric:tabular-nums}.gp .gb{min-width:0;display:flex;flex-direction:column;gap:2px}
.gp .gb small{color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gp.now{background:rgba(229,9,20,.1);border-radius:10px;padding:10px 8px}.gp.old{opacity:.5}.gp .btn svg{width:18px;height:18px}
.stb{display:inline-block;margin-left:4px;padding:0 6px;border-radius:4px;background:rgba(70,200,120,.18);color:var(--ok);font-weight:700;font-size:.72rem}.stb.no{background:var(--surface2);color:var(--muted)}

/* ===== TV layout ===== */
body.tv{overflow:hidden}
body.tv #nav{display:none!important}
.tvtop{position:fixed;top:0;left:0;width:var(--tvw,100vw);box-sizing:border-box;height:64px;z-index:40;display:flex;align-items:center;gap:34px;padding:0 40px;background:linear-gradient(rgba(12,12,16,.98),rgba(12,12,16,.9))}
.tvlogo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;white-space:nowrap}
.tvlogo svg{width:34px;height:34px;flex:none}
.tvtabs{display:flex;gap:6px}
.tvtabs button{position:relative;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:1.02rem;padding:8px 12px;border-radius:10px;white-space:nowrap}
.tvtabs button[aria-current="page"]{color:#fff}
.tvtabs button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:2px;background:var(--accent)}
.tvtabs button.tvf{background:#fff;color:#111}
.tvicons{margin-left:auto;display:flex;align-items:center;gap:12px}
.tvic{position:relative;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.07);color:#fff;display:flex;align-items:center;justify-content:center}
.tvic svg{width:22px;height:22px}.tvic.on{box-shadow:inset 0 -3px 0 var(--accent)}
.tvic .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tvav{border:0;background:none;padding:0;border-radius:50%}
.tvic.tvf,.tvav.tvf{box-shadow:0 0 0 3px #fff}
.tvclock{font-family:var(--display);font-weight:700;font-size:1.3rem;color:#cfcfd6;margin-left:12px;font-variant-numeric:tabular-nums}
body.tv main.tvmain{min-height:0;position:fixed;top:64px;left:0;width:var(--tvw,100vw);height:calc(var(--tvh,100vh) - 64px);box-sizing:border-box;padding:0 40px!important;overflow:hidden;display:flex;flex-direction:column}
.tvscroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;flex:1;min-height:0}
.tvscroll::-webkit-scrollbar{display:none}
.tvhero{position:relative;flex:none;height:calc(var(--tvh,100vh) * .34);min-height:180px;display:flex;align-items:center;margin:0 -40px;padding:0 40px}
.tvhero.small{height:auto;min-height:0;margin:0;padding:10px 0 12px}
.tvhbg{position:absolute;right:0;top:0;bottom:0;width:58%;background:center 25%/cover no-repeat;opacity:.5;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.tvhbg:not(.wide){width:34%;opacity:.35}
.tvhero::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 90% at 0% 40%,rgba(229,9,20,.14),transparent 70%);pointer-events:none}
.tvhero.small .tvhbg,.tvhero.small::after{display:none}
.tvhin{position:relative;z-index:1;max-width:62%}
.tvhero.small .tvhin{max-width:none}
.tvhtxt .kick{display:block;color:var(--accent2,#ff4d57);font-weight:800;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.tvhtxt h1{margin:0;font-family:var(--display);font-weight:800;font-size:2.5rem;line-height:1.04;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tvhero.small h1{font-size:1.7rem;-webkit-line-clamp:1}
.tvhtxt .meta{display:flex;flex-wrap:wrap;gap:4px 0;margin:10px 0 0;color:#d4d4dc;font-weight:600}
.tvhtxt .meta span+span::before{content:"•";margin:0 10px;color:var(--accent)}
.tvhtxt .plot{margin:10px 0 0;color:#b9b9c3;line-height:1.45;max-width:62ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tvrows{margin:0 -40px;padding:0 40px}
.tvrow{padding:4px 0 6px;scroll-margin-top:0}
.tvrow h2{margin:6px 0 2px;font-family:var(--display);font-size:1.12rem;font-weight:700}
body.tv .tvrow .row{margin:0 -40px;padding:12px 40px;gap:16px;scroll-padding-inline:40px}
.tvtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:14px 0 10px}
.tvtile{position:relative;height:118px;border:0;border-radius:18px;color:#fff;text-align:left;padding:16px 20px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden;transition:transform .12s}
.tvtile svg{position:absolute;top:16px;left:20px;width:30px;height:30px}
.tvtile b{font-family:var(--display);font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
.tvtile small{color:rgba(255,255,255,.82);font-size:.88rem;font-weight:600}
.tvtile.t1{background:linear-gradient(135deg,#ff2a36,#b00611)}
.tvtile.t2{background:linear-gradient(135deg,#8c1c2b,#3d0b14)}
.tvtile.t3{background:linear-gradient(135deg,#e8952f,#9a4a0d)}
.tvtile.t4{background:var(--surface2)}
.tvtile.tvf{transform:scale(1.03);box-shadow:0 0 0 3px #fff,0 14px 30px rgba(0,0,0,.45)}
body.tv .poster{width:128px}
body.tv .poster .t{display:none}
body.tv .poster .art{border-radius:12px}
.rkb{position:absolute;left:6px;top:6px;z-index:2;background:var(--accent);color:#fff;font-weight:800;font-size:.72rem;padding:2px 7px;border-radius:6px}
.tvbrowse{flex:1;min-height:0;display:grid;grid-template-columns:240px 1fr;gap:30px;padding-top:14px}
.tvside{overflow-y:auto;scrollbar-width:none;padding:2px 4px calc(var(--tvh,100vh) * .4) 2px;display:flex;flex-direction:column;gap:3px}
.tvside::-webkit-scrollbar{display:none}
.tvside h2{margin:4px 0 10px 12px;font-family:var(--display);font-size:1.25rem}
.tvcat{display:flex;align-items:center;gap:8px;border:0;background:none;color:#d8d8e0;font:inherit;font-weight:600;font-size:.98rem;text-align:left;padding:9px 14px;border-radius:10px;position:relative}
.tvcat span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tvcat b{color:var(--muted);font-weight:600;font-size:.85rem;font-variant-numeric:tabular-nums}
.tvcat svg{width:16px;height:16px;color:var(--gold,#f5c518)}
.tvcat[aria-current="true"]{background:var(--surface2);color:#fff}
.tvcat[aria-current="true"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
.tvcat.tvf{background:#fff;color:#111}.tvcat.tvf b{color:#444}
.tvmainc{min-width:0;display:flex;flex-direction:column;min-height:0}
.tvdet{display:flex;align-items:flex-start;gap:16px;flex:none}
.tvdet .tvhero{flex:1;min-width:0}
.tvsort{margin-top:14px;flex:none;border:0;border-radius:999px;background:var(--surface2);color:#ddd;font:inherit;font-weight:600;font-size:.9rem;padding:8px 14px;display:flex;align-items:center;gap:8px}
.tvsort i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tvsort.tvf{background:#fff;color:#111}
.tvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:18px;padding:10px 8px}
body.tv .tvgrid .poster{width:auto}
body.tv .tvmainc .chlist{padding:8px 6px;gap:8px}
body.tv .tvmainc .ch{grid-template-columns:72px 1fr auto auto}
body.tv .tvguide .gwrap{margin-top:4px}
.tvsearch{flex:1;min-height:0;display:grid;grid-template-columns:min(420px,40%) 1fr;gap:34px;padding-top:16px}
.tvq{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:12px;min-height:30px}
.tvq svg{width:22px;height:22px;color:var(--muted)}.tvq b{font-size:1.3rem;font-weight:700}.tvq i{color:var(--muted);font-weight:500;font-style:normal}
.tvkb .keys{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.tvkb .key{height:44px;border:0;border-radius:10px;background:var(--surface2);color:#fff;font:inherit;font-weight:700;font-size:1.05rem}
.tvkb .key.space{grid-column:span 7}.tvkb .key[data-kb="clear"]{grid-column:span 3;font-size:.9rem}
.tvkb .key.tvf{background:var(--accent);box-shadow:0 0 0 3px #fff}
.tvres{padding-right:8px}
.tvchrow{gap:14px}
.tvch{flex:none;width:150px;border:0;border-radius:14px;background:var(--surface);color:#fff;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;font-weight:600;font-size:.85rem}
.tvch img,.tvch .ph{width:110px;height:62px;object-fit:contain;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.tvch span:last-child{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.tvch.tvf{box-shadow:0 0 0 3px #fff;transform:scale(1.04)}
#tvsubs{position:absolute;left:10%;right:10%;bottom:12%;z-index:2;text-align:center;white-space:pre-line;font-size:2.1rem;font-weight:600;line-height:1.25;color:#fff;text-shadow:0 2px 4px #000,0 0 2px #000;pointer-events:none}
#tvplayer:not(.idle) #tvsubs{bottom:26%}
#tvpanel{position:absolute;right:50px;top:50px;z-index:3;width:440px;max-height:80%;overflow:hidden;background:rgba(16,16,20,.94);border-radius:18px;padding:18px 18px 10px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
#tvpanel h3{margin:10px 8px 6px;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2,#ff4d57)}
.tvpi{padding:12px 14px;border-radius:10px;font-size:1.15rem;font-weight:600;color:#ddd}
.tvpi.sel{background:#fff;color:#111}
#tvpanel .hint{color:#999;margin:10px 8px 4px;font-size:.9rem}
.minivid{position:sticky;top:var(--toph,64px);z-index:30;background:var(--bg);margin:10px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:6px max(16px,env(safe-area-inset-left,0px)) 8px;box-shadow:0 10px 16px -10px rgba(0,0,0,.8)}
.mv-box{aspect-ratio:16/9;border-radius:12px;background:#000;display:flex;align-items:center;justify-content:center;color:#888;font-size:.85rem}
.mv-bar{display:flex;align-items:center;gap:8px;margin-top:8px}
.mv-t{flex:1;min-width:0;display:flex;flex-direction:column}.mv-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mv-t small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-full{min-height:38px;padding:6px 12px;font-size:.85rem}.mv-full svg{width:18px;height:18px}
.grow.on .glab{background:var(--accent);color:#fff}

</style>
<style>
/* Layout: streaming-app look — billboard on top, horizontal rows by category, landscape "resume" cards, full-height detail sheets, bottom tab bar */
:root{
  --bg:#101014; --surface:#1b1b22; --surface2:#26262f; --ink:#f5f5f7; --muted:#a4a4b0; --line:#2d2d38;
  --accent:#e50914; --accent2:#ff3d47; --gold:#f5c518; --ok:#46d39a; --live:#ff3d47;
  --display:"Bricolage Grotesque","Arial Narrow",ui-sans-serif,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --navh:62px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg{flex:none}

/* top bar: transparent over the billboard, solid once scrolled */
.top{position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(rgba(16,16,20,.85),rgba(16,16,20,0));transition:background .2s}
.top.solid{background:rgba(16,16,20,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top.over{position:fixed;left:0;right:0}
.top .in{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;flex:none;color:var(--ink)}
.brand svg{width:26px;height:26px;color:#f5c518}
.acc{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.12);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.86rem;min-height:36px;max-width:100%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill svg{width:16px;height:16px}
.upd{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);white-space:nowrap}
.upd i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin 1s linear infinite}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{background:var(--accent);color:#fff}
#castbar{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:55;background:#23232c;border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) 8px;display:flex;flex-direction:column;gap:6px}
#castbar .cb-top{display:flex;align-items:center;gap:10px;min-width:0}
#castbar .cb-ic{color:var(--accent2);display:flex}#castbar .cb-ic svg{width:22px;height:22px}
#castbar .cb-t{min-width:0;flex:1}#castbar b{display:block;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#castbar small{display:block;color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#castbar .cb-bar{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden}#castbar .cb-bar i{display:block;height:100%;background:var(--accent)}
#castbar .cb-acts{display:flex;justify-content:center;gap:10px}
#castbar .cb-acts button{border:0;background:rgba(255,255,255,.1);color:var(--ink);border-radius:999px;min-width:52px;height:40px;padding:0 14px;font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center}
#castbar .cb-acts button svg{width:18px;height:18px}
body.casting main{padding-bottom:calc(var(--navh) + 140px + env(safe-area-inset-bottom,0px))}
.castdev{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--surface2);border-radius:10px;padding:12px;color:var(--ink)}
.castdev .di{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}.castdev .di svg{width:20px;height:20px}
.castdev b{display:block}.castdev small{display:block;color:var(--muted);font-size:.8rem}
.castdev[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}.castdev[aria-pressed="true"] .di{background:var(--accent)}
.searchbar{display:flex;gap:8px;padding-bottom:10px}
.searchbar input{flex:1;min-width:0;font:inherit;font-size:16px;background:var(--surface2);color:var(--ink);border:0;border-radius:8px;padding:11px 14px}

main{padding-bottom:calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px));min-height:100vh}
.sec{margin-top:22px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sech h2{margin:0;font-family:var(--body);font-weight:700;font-size:1.12rem;letter-spacing:-.01em}
.sech .more{border:0;background:none;color:var(--muted);font-weight:600;font-size:.84rem;padding:4px 0}
.muted{color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty p{margin:0;max-width:36ch}

/* billboard */
.bill{position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(70px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 6px;overflow:hidden;text-align:center}
.bill .bg{position:absolute;inset:-30px;background:var(--surface) center/cover no-repeat;filter:blur(28px) saturate(1.2);opacity:.55;transform:scale(1.1)}
.bill .bg.sharp{inset:0;filter:none;opacity:.9;transform:none}
.bill::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(16,16,20,.2) 0%,rgba(16,16,20,0) 30%,rgba(16,16,20,.55) 70%,var(--bg) 100%)}
.bill .card{position:relative;z-index:1;display:block;width:min(64vw,300px);aspect-ratio:2/3;margin:0 auto;border-radius:12px;overflow:hidden;background:var(--surface2);box-shadow:0 18px 40px rgba(0,0,0,.6);border:0;padding:0}
.bill .card img{width:100%;height:100%;object-fit:cover;display:block}
.bill .card .ph{display:flex;align-items:center;justify-content:center;height:100%;padding:16px;font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.05}
.bill .info{position:relative;z-index:1;margin-top:14px}
.bill h1{margin:0 0 6px;font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.bill .tags{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 10px;font-size:.85rem;color:#d7d7de}
.bill .tags span+span::before{content:"•";margin-right:10px;color:var(--accent2)}
.bill .acts{justify-content:center;margin-top:14px}
.bslides{position:relative;z-index:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.bslides::-webkit-scrollbar{display:none}
.bslide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.bill .bg{transition:background-image .4s}
.bdots{position:relative;z-index:1;display:flex;justify-content:center;gap:6px;margin-top:14px}
.bdots button{width:7px;height:7px;border-radius:4px;border:0;padding:0;background:rgba(255,255,255,.35);transition:width .2s,background .2s}
.bdots button[aria-current="true"]{width:20px;background:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:#fff;border-radius:4px;padding:2px 6px}

/* rows & grids */
.row{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));padding-bottom:4px;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.row::-webkit-scrollbar{display:none}
.poster{flex:none;width:108px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;position:relative}
.poster .art{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.poster .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.poster .ph{font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--muted);padding:8px;text-align:center;line-height:1.1}
.poster .t{display:none}
.poster.labeled .t{display:block;margin-top:6px;font-size:.8rem;font-weight:600;line-height:1.2;max-height:2.4em;overflow:hidden;color:#d7d7de}
.poster .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25)}
.poster .bar i{display:block;height:100%;background:var(--accent)}
.poster .rate{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.75);color:var(--gold);font-weight:800;font-size:.7rem;border-radius:4px;padding:1px 5px}
.poster .fav{position:absolute;top:5px;right:5px;color:#fff}
.poster .fav svg{width:15px;height:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
.poster .new{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);white-space:nowrap}
.top10{display:flex;align-items:flex-end;flex:none;scroll-snap-align:start;border:0;background:none;padding:0}
.top10 .rk{font-family:var(--display);font-weight:800;font-size:5.4rem;line-height:.8;color:var(--bg);-webkit-text-stroke:2px #8a8a96;margin-right:-14px;position:relative;z-index:0;letter-spacing:-.06em}
.top10 .poster{z-index:1}
.wide{flex:none;width:228px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left}
.wide .art{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--surface2)}
.wide .art img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.wide .art::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 45%,rgba(0,0,0,.75))}
.wide .pl{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.wide .pl svg{width:18px;height:18px;margin-left:2px}
.wide .lab{position:absolute;z-index:1;left:8px;right:8px;bottom:10px;font-size:.8rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wide .bar{position:absolute;z-index:1;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25)}
.wide .bar i{display:block;height:100%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px 8px}
.grid .poster{width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #4a4a56;background:transparent;border-radius:999px;padding:6px 13px;font-size:.84rem;font-weight:600;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#111}
.chip b{font-weight:500;opacity:.65;margin-left:4px;font-size:.76rem}
.freshness{display:flex;align-items:center;justify-content:space-between;gap:10px;white-space:nowrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.freshness button{border:0;background:none;color:var(--ink);font-weight:700;font-size:.8rem;display:inline-flex;align-items:center;gap:5px;padding:4px 0}
.freshness svg{width:14px;height:14px}
.pagehead{padding-top:calc(4px);display:flex;align-items:baseline;gap:10px}
.pagehead h1{margin:0;font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.01em}

/* channels */
.chlist{display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:76px 1fr auto auto;gap:8px;align-items:center;padding:8px;border-radius:10px;background:var(--surface)}
.logo{width:76px;height:52px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border:0;padding:4px}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.logo .ph{font-family:var(--display);font-weight:800;font-size:.95rem;color:#333}
.ch .n{min-width:0;border:0;background:none;padding:0;text-align:left}
.ch .n b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .epg{display:block;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .epg em{font-style:normal;color:var(--ink)}
.ch .prog{display:block;height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.ch .prog i{display:block;height:100%;background:var(--accent)}
.star{border:0;background:none;padding:8px;color:var(--muted)}
.star.on{color:var(--ink)}
.star svg{width:22px;height:22px}
.livetag{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--live)}
.livetag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live)}
.morebtn{display:block;margin:14px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600}

/* buttons: primary is white like streaming apps */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:#fff;color:#111;border-radius:6px;padding:10px 18px;font-weight:700;min-height:44px;text-decoration:none;font-size:.98rem}
.btn.ghost{background:rgba(255,255,255,.16);color:var(--ink)}
.btn.danger{background:transparent;color:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent2)}
.btn.red{background:var(--accent);color:#fff}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(16,16,20,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{display:grid;grid-template-columns:repeat(5,1fr);height:var(--navh);max-width:720px;margin:0 auto}
#nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7rem;font-weight:600;color:#8a8a96}
#nav button svg{width:22px;height:22px}
#nav button[aria-current="page"]{color:var(--ink)}

/* detail sheet: near full height, big image header */
#sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:720px;max-height:96%;overflow-y:auto;border-radius:14px 14px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.panel.full{height:96%}
.hero{position:relative;aspect-ratio:16/10;max-height:340px;width:100%;background:var(--surface2) center 20%/cover no-repeat;border-radius:14px 14px 0 0;overflow:hidden}
.hero.blur::before{content:"";position:absolute;inset:-20px;background:inherit;background-size:cover;filter:blur(18px);opacity:.7}
.hero .thumb{position:absolute;z-index:1;left:50%;bottom:14px;transform:translateX(-50%);height:78%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.6);background:var(--surface2)}
.hero .thumb img{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(27,27,34,0) 55%,var(--surface) 100%);z-index:1}
.hero.noimg{aspect-ratio:auto;height:58px;background:none}
.hero.noimg::after,.hero.noimg::before{display:none}
.hero .x{position:absolute;top:10px;right:10px;z-index:2;background:rgba(0,0,0,.6)}
.panel .in{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.panel .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.panel h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.05;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;color:var(--muted);font-size:.86rem}
.meta b{color:var(--ok)}
.meta .imdb{background:var(--gold);color:#111;font-weight:800;border-radius:4px;padding:0 5px;font-size:.78rem}
.plot{margin:0;color:#d9d9e0;font-size:.95rem;max-width:65ch}
.panel .acts .btn{flex:1 1 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ep{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.epplay{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 0;background:none;border:0;text-align:left;min-width:0}
.ep .num{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--muted);min-width:2ch;text-align:right}
.ep b{display:block;font-weight:600}
.ep small{color:var(--muted)}
.ep .bar{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden;max-width:160px}
.ep .bar i{display:block;height:100%;background:var(--accent)}
.ep .seen{color:var(--ok);font-size:.78rem;font-weight:600}
.epdl{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;height:40px;border-radius:8px;border:0;background:var(--surface2);color:var(--ink);font-size:.75rem;font-weight:700;padding:0 8px}
.epdl svg{width:18px;height:18px}
.epdl.done{color:var(--ok)}
.epdl.warn{color:var(--accent2)}
.dlrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dlrow .art{width:52px;aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:var(--surface2)}
.dlrow .art img{width:100%;height:100%;object-fit:cover}
.dlrow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlrow small{display:block;color:var(--muted)}
.dlrow small.ok{color:var(--ok)}
.dlbar{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.dlbar i{display:block;height:100%;background:var(--accent)}
.dlacts{display:flex;gap:6px}
.offline{background:var(--surface2);border-radius:8px;padding:8px 12px;font-size:.86rem;margin-top:8px}
.chk{display:flex;align-items:flex-start;gap:10px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}

/* forms */
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:.76rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select{font:inherit;font-size:16px;background:var(--surface2);color:var(--ink);border:1px solid transparent;border-radius:6px;padding:12px;width:100%}
.fld input:focus,.fld select:focus{border-color:#fff;outline:none}
.hint{font-size:.8rem;color:var(--muted)}
.err{color:var(--accent2);font-size:.9rem;margin:0}
.okmsg{color:var(--ok);font-size:.9rem;margin:0}
.accrow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--surface2)}
.accrow.on{box-shadow:inset 0 0 0 2px #fff}
.accrow .n{flex:1;min-width:0}
.accrow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accrow small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.updrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.updrow b{display:block}
.updrow small{color:var(--muted)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:80px 16px;color:var(--muted);text-align:center}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));z-index:200;background:#fff;color:#111;font-weight:600;padding:10px 14px;border-radius:8px;font-size:.9rem;max-width:min(92vw,520px)}
#webplayer{position:fixed;inset:0;z-index:150;background:#000;display:flex;flex-direction:column}
#webplayer video{flex:1;width:100%;min-height:0;background:#000}
#webplayer .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
#webplayer .bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.welcome h1{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.02;margin:24px 0 8px;letter-spacing:-.02em}
@media (max-width:440px){.brand{font-size:1.1rem;gap:5px}.brand svg{width:22px;height:22px}.top .in{gap:6px}.acc{gap:6px}.iconbtn{width:36px;height:36px}.pill{padding:6px 10px;max-width:42vw}}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:28%;color:#fff;font-family:var(--display);font-weight:800;flex:none;line-height:1}
.pill .avatar{border-radius:50%}
.avatar.add{background:transparent;border:2px dashed #5a5a66;color:var(--muted)}.avatar.add svg{width:36px;height:36px}
.picker{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:40px}
.picker h1{font-family:var(--display);font-weight:800;font-size:1.9rem;margin:28px 0 22px;text-align:center}
.pgrid{display:grid;grid-template-columns:repeat(2,120px);gap:22px 26px;justify-content:center}
@media (min-width:560px){.pgrid{grid-template-columns:repeat(4,120px)}}
.ptile{border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:10px;padding:0;position:relative}
.ptile b{font-weight:600;font-size:.95rem;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.ptile.on b{color:var(--ink)}.ptile.on .avatar{box-shadow:0 0 0 3px #fff}
.ptile .pen{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}.ptile .pen svg{width:18px;height:18px}
.swatch{width:36px;height:36px;border-radius:50%;border:0;padding:0}.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px #fff}
/* TV: side rail instead of bottom bar, big visible focus, no touch-only bits */
body.tv .sec{scroll-margin-top:96px}

body.tv .bill::after{background:linear-gradient(90deg,var(--bg) 0%,rgba(16,16,20,.88) 34%,rgba(16,16,20,.25) 70%,rgba(16,16,20,.55) 100%),linear-gradient(rgba(16,16,20,0) 55%,var(--bg) 100%)}

body.tv .bill .card{width:200px;margin:0 0 0 auto;flex:none;box-shadow:0 24px 60px rgba(0,0,0,.7)}

body.tv .tvtitle{margin:0 0 10px;font-family:var(--display);font-weight:800;font-size:2.7rem;line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
body.tv .bill .tags{justify-content:flex-start;font-size:1rem}

body.tv{--navh:0px}

body.tv #nav button{font-size:.78rem;border-radius:14px;margin:4px 10px}
body.tv #nav button svg{width:28px;height:28px}
body.tv main,body.tv .top .in,body.tv .bill{padding-left:124px!important}

body.tv main{padding-bottom:60px}

  s=s.replace(/\/(player_api\.php|get\.php|panel_api\.php|xmltv\.php).*$/i,'').replace(/\/+$/,'');

    if(!r.ok)throw new Error('HTTP '+r.status);

      if((c.live||[]).length&&!c.live.some(function(x){return 'tv_archive' in x}))setTimeout(function(){refreshSection('live',false)},3000);setTimeout(dailyRefresh,1500);return;

    return Promise.all(['live','vod','series'].map(function(sec){
      return fetchSection(a,sec).then(function(r){var keep=DATA;DATA=d;applySection(sec,r);DATA=keep},function(e){errs.push(SECT[sec].label+' : '+errText(e))});

/* after each catalogue load: favourites whose number changed at the provider are found again by their name */
function repairFavs(){
  if(!DATA||!USER||!USER.favs)return;var F=USER.favs,changed=false;
  Object.keys(F).forEach(function(k){
    var f=F[k];if(!f||!f.kind)return;var x=byId(f.kind,f.id);
    if(x){if(!f.name){f.name=x.name;f.icon=x.stream_icon||x.cover||'';changed=true}return}
    if(!f.name)return;
    var L=f.kind==='live'?DATA.live:f.kind==='movie'?DATA.vod:DATA.series,key=vpOf({name:f.name}).key,yr=year(f.name),n=cleanName(f.name).toLowerCase();
    var hit=null;for(var i=0;i<L.length&&!hit;i++){if(cleanName(L[i].name).toLowerCase()===n)hit=L[i]}
    if(!hit&&f.kind!=='live'&&key.length>2)for(var j=0;j<L.length&&!hit;j++){var y=L[j];if(vpOf(y).key===key&&(!yr||year(y.name)===yr))hit=y}
    if(!hit)return;
    var nid=hit.stream_id||hit.series_id,nk=fkey(f.kind,nid);if(nk===k)return;
    delete F[k];F[nk]=Object.assign({},f,{id:nid});changed=true;
  });
  if(changed)saveUser();
}
function byId(kind,id){
  if(!DATA)return null;
  var L=kind==='live'?DATA.live:kind==='movie'?DATA.vod:DATA.series;
  for(var i=0;i<L.length;i++){var x=L[i];if(String(x.stream_id||x.series_id)===String(id))return x}

}

var pollT=null,freeBytes=0;
/* French subtitles for downloaded videos: the file's own first; OpenSubtitles only when it has none
   (and the audio is not French), fetched once and kept with the video for offline viewing */
var PROBE={};
function checkDlSubs(k){

  var set=function(v){var x=USER.downloads[k];if(x){x.st=v;saveUser();refreshUi()}};

    if(c&&c.srt){set('opensub');return}

    });

function pollDownloads(){
  clearTimeout(pollT);

  var keys=Object.keys(USER.downloads||{});if(!keys.length)return;
  var ids=keys.map(function(k){return USER.downloads[k].dlId});
  nat('downloadStatus',{ids:ids}).then(function(r){

      if(d.status!==x.status||d.bytes!==x.bytes||d.localUri!==x.localUri||d.wait!==x.wait){changed=true}
      d.status=x.status==='pending'?'queued':x.status;d.bytes=x.bytes;d.total=x.total>0?x.total:d.total;d.localUri=x.localUri||d.localUri;d.reason=x.reason;d.wait=x.wait||'';d.speed=x.speed||0;d.error=x.error||'';

function dlLabel(d){

/* TV detail page: titles of the same category, best rated first */
function similarHtml(kind,x){
  var id=String(x.stream_id||x.series_id),L=visList(kind).filter(function(y){return y.category_id===x.category_id&&String(y.stream_id||y.series_id)!==id});

  return L.length>=2?'<div class="tvsim">'+tvRow('Titres similaires',tvPosters(L,kind))+'</div>':'';
}
function movieDlHtml(x){
  if(!NATIVE)return '';
  var k='movie:'+x.stream_id,d=dlOf(k);
  if(sheet&&sheet.confirmDl===k)return '<button type="button" class="btn danger" data-dlrm="'+esc(k)+'">Confirmer la suppression</button>';
  if(!d)return '<button type="button" class="btn ghost" data-dlmovie="'+esc(x.stream_id)+'">'+IC.dl+'Télécharger</button>';
  if(d.status==='done')return '<button type="button" class="btn ghost" data-dlask="'+esc(k)+'" style="color:var(--ok)">'+IC.check+esc(dlLabel(d))+'</button>';
  return '<button type="button" class="btn ghost" data-dlask="'+esc(k)+'">'+esc(dlLabel(d))+'</button>';
}
function allEpisodes(){var e=(sheet&&sheet.info&&sheet.info.episodes)||{};var out=[];Object.keys(e).sort(function(a,b){return a-b}).forEach(function(s){(e[s]||[]).forEach(function(ep){ep.season=ep.season||s;out.push(ep)})});return out}
function nextEpisode(ep){var L=allEpisodes();for(var i=0;i<L.length;i++)if(String(L[i].id)===String(ep.id))return L[i+1]||null;return null}
function resumeEpisode(sp){
  var L=allEpisodes();if(!L.length)return null;
  var i=L.findIndex(function(e){return String(e.id)===String(sp.last)});
  if(i<0)return null;
  var cur=L[i],pe=progressOf('ep:'+cur.id);
  var lab=function(e){return 'S'+String(e.season).padStart(2,'0')+'E'+String(e.episode_num).padStart(2,'0')};
  if(pe&&!pe.done&&pe.pos>0)return{ep:cur,label:lab(cur),resume:true};
  var n=L[i+1];return n?{ep:n,label:lab(n),resume:false}:null;
}
function openItem(kind,id){
  var x=byId(kind,id);if(!x)return;
  if(kind==='live'){playLive(x);return}

  var ck='info:'+S.activeId+':'+kind+':'+id,shown='',live=function(){return sheet&&sheet.item===x};
  var show=function(r){var j=JSON.stringify(r||{});if(!live()||j===shown)return;var first=!shown;shown=j;sheet.loading=false;sheet.info=kind==='movie'?(r&&r.info)||{}:r||{};if(first){renderSheet();if(TV)setTimeout(function(){var pb=document.querySelector('#sheet .btn:not(.ghost)');if(pb)focusEl(pb)},20)}else softSheet()};
  kget(ck).then(function(c){if(c&&!shown)show(c)},function(){});
  var p=kind==='movie'?api(acc(),'action=get_vod_info&vod_id='+id):api(acc(),'action=get_series_info&series_id='+id);

}

  if(a.server&&!/^https?:\/\//i.test(a.server))a.server='http://'+a.server;

    a.maxConn=+ui.max_connections||1;
    var exp=+ui.exp_date;a.info=(exp?'Expire le '+new Date(exp*1000).toLocaleDateString('fr-FR'):'Sans date d\'expiration')+(ui.max_connections?' · '+ui.max_connections+' écran'+(ui.max_connections>1?'s':''):'');
    var i=S.accounts.findIndex(function(x){return x.id===a.id});

  r.style.setProperty('--tvh',(window.innerHeight/z).toFixed(1)+'px');r.style.setProperty('--tvw',(w/z).toFixed(1)+'px')}
tvScale();window.addEventListener('resize',tvScale);

/* ---------- remote control: arrows move the focus to the nearest item in that direction ---------- */
var FOCUSABLE='button:not([disabled]):not([tabindex="-1"]),a[href],input:not([type=hidden]):not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
function visibleEl(el){if(!el||el.hidden)return false;var r=el.getBoundingClientRect();if(!r.width||!r.height)return false;var st=getComputedStyle(el);return st.visibility!=='hidden'&&st.display!=='none'}
function navScope(){
  if(!$('#tvplayer').hidden)return $('#tvplayer');
  if(sheet&&!$('#sheet').hidden)return $('#sheet');
  return document.body;
}
function focusables(){
  var sc=navScope();
  return [].filter.call(sc.querySelectorAll(FOCUSABLE),function(el){
    if(!visibleEl(el)||el.closest('[hidden]')||(sc===document.body&&el.closest('#sheet,#tvplayer')))return false;
    /* only the suggestion currently shown in the carousel */
    var sl=el.closest('.bslide');if(sl){var r=sl.getBoundingClientRect(),w=window.innerWidth;if(r.left<-80||r.right>w+80)return false}
    return true;
  });
}
function tvZone(el){return el.closest('.tvside')?'side':el.closest('.tvkb')?'kb':el.closest('.tvres')?'res':el.closest('.tvmainc')?'main':el.closest('.tvprev')?'prev':null}
function moveFocus(dir){
  var cur=document.activeElement,L=focusables();
  if(!L.length)return false;
  if(!cur||cur===document.body||L.indexOf(cur)<0){
    /* the focus got lost (screen redrawn, element removed): back to where it was, else the first item of the page */
    var back=lastFocus&&document.contains(lastFocus)&&L.indexOf(lastFocus)>=0?lastFocus:null;
    if(!back&&TV&&!sheet)back=[].filter.call(document.querySelectorAll('.tvmainc .poster,.tvmainc .ch .logo,.tvkb .key,.tvrows .poster,.tvrows .tvchc,.tvside [aria-current="true"]'),visibleEl)[0];
    focusEl(back||L[0]);return true}
  var a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,best=null,bs=1e9;
  var inNav=!!cur.closest('#nav'),vert=dir==='up'||dir==='down';
  var curZone=TV?tvZone(cur):null,inTop=!!cur.closest('.tvtop');
  L.forEach(function(el){
    if(el===cur)return;
    /* up/down stay in the side menu or in the page; left/right switch between them */
    if(vert&&!!el.closest('#nav')!==inNav)return;
    /* TV: up/down never jump between the category column and the page next to it */
    if(vert&&curZone&&tvZone(el)&&tvZone(el)!==curZone)return;
    /* the top menu is reached with ▲ only, never sideways from the page */
    if(!vert&&TV&&!inTop&&el.closest('.tvtop'))return;
    var b=el.getBoundingClientRect(),bx=b.left+b.width/2,by=b.top+b.height/2,dx=bx-ax,dy=by-ay,main,side,overlap;
    if(dir==='right'){if(b.left<a.right-4&&dx<=4)return;main=Math.max(0,b.left-a.right);side=Math.abs(dy);overlap=b.bottom>a.top&&b.top<a.bottom}
    else if(dir==='left'){if(b.right>a.left+4&&dx>=-4)return;main=Math.max(0,a.left-b.right);side=Math.abs(dy);overlap=b.bottom>a.top&&b.top<a.bottom}
    else if(dir==='down'){if(b.top<a.bottom-4&&dy<=4)return;main=Math.max(0,b.top-a.bottom);side=Math.abs(dx);overlap=b.right>a.left&&b.left<a.right}
    else{if(b.bottom>a.top+4&&dy>=-4)return;main=Math.max(0,a.top-b.bottom);side=Math.abs(dx);overlap=b.right>a.left&&b.left<a.right}
    /* stay in the same row / column when possible */
    var sc=main+side*(overlap?0.3:2.5)+(overlap?0:60)-(el.matches('.btn:not(.ghost)')?60:0);
    if(sc<bs){bs=sc;best=el}
  });
  /* entering the side menu: land on the current tab */
  if(best&&best.closest('#nav')&&!cur.closest('#nav')){var curTab=document.querySelector('#nav [aria-current="page"]');if(curTab)best=curTab}
  if(best&&best.closest('.tvtabs')&&!cur.closest('.tvtop')){var ct=document.querySelector('.tvtabs [aria-current="page"]');if(ct)best=ct}
  if(best&&best.closest('.tvside')&&!cur.closest('.tvside')){var cc=document.querySelector('.tvside [aria-current="true"]');if(cc&&visibleEl(cc))best=cc}
  /* entering the channel list from the side: on the channel itself, not on its buttons */
  if(best&&TV&&curZone&&tvZone(best)!==curZone){var bch=best.closest('.ch');if(bch){var lg=bch.querySelector('[data-play]');if(lg)best=lg}}
  if(best){focusEl(best);return true}
  return false;
}
/* TV: the focused item must always be on screen (after a redraw the lists may have moved back) */
function tvEnsure(el){
  if(!TV||!el||el===document.body)return;var r=el.getBoundingClientRect(),top=document.querySelector('.tvtop'),tb=top&&!sheet?top.getBoundingClientRect().bottom:0;
  if(r.top<tb-4||r.bottom>innerHeight+2||r.left<-2||r.right>innerWidth+2){if(el.closest('.panel'))el.scrollIntoView({block:'nearest',inline:'nearest'});else tvScrollTo(el)}
  tvPin();
}
function focusEl(el){
  var old=document.querySelector('.tvf');if(old&&old!==el)old.classList.remove('tvf');el.classList.add('tvf');
  try{el.focus({preventScroll:true})}catch(e){el.focus()}
  if(TV&&!el.closest('.panel,#nav,#tvplayer')){tvScrollTo(el);return}
  var row=el.closest('.row,.chips,.bslides');
  if(row){var r=el.getBoundingClientRect(),rr=row.getBoundingClientRect();if(r.left<rr.left+10)row.scrollLeft-=rr.left+24-r.left;else if(r.right>rr.right-10)row.scrollLeft+=r.right-rr.right+24}
  var box=el.closest('.panel')||null,vr=el.getBoundingClientRect();
  if(box){var br=box.getBoundingClientRect();if(vr.top<br.top+20)box.scrollTop-=br.top+40-vr.top;else if(vr.bottom>br.bottom-20)box.scrollTop+=vr.bottom-br.bottom+40}
  if(TV&&box){var vr2=el.getBoundingClientRect();if(vr2.top<0||vr2.bottom>innerHeight)el.scrollIntoView({block:'center',inline:'nearest'});tvPin();return}
  else if(!el.closest('#nav')){var top=110,bot=innerHeight-40;if(vr.top<top)window.scrollBy(0,vr.top-top-20);else if(vr.bottom>bot)window.scrollBy(0,vr.bottom-bot+20)}
}
/* keep the focus on "the same" item when the screen is redrawn */
/* TV: the row of the focused item comes just under the header; a tall block (grid, guide) keeps the item centred */
function tvScrollTo(el){
  if(el.closest('.top,.tvtop'))return;
  if(el.closest('.bill')){window.scrollTo(0,0);return}
  try{
    if(el.closest('.tvside'))el.scrollIntoView({block:'nearest'});
    else if(el.closest('.tvtiles')){var sc=el.closest('.tvscroll');if(sc)sc.scrollTop=0}
    else if(el.closest('.tvrow')&&el.closest('.tvrows')){el.closest('.tvrow').scrollIntoView({block:'start'});var rw=el.closest('.row');if(rw){var cell=el.closest('.top10')||el;rw.scrollLeft=Math.max(0,cell.offsetLeft-parseFloat(getComputedStyle(rw).paddingLeft||0))}}
    else if(el.closest('.tvgrid')){var gs=el.closest('.tvscroll'),gr=el.getBoundingClientRect(),gsr=gs.getBoundingClientRect(),z=gs.clientHeight?gsr.height/gs.clientHeight:1;
      /* grids move by whole rows: the row of the focused title at the top, nothing cut above it */
      if(gr.top<gsr.top+8||gr.bottom>gsr.bottom-8)gs.scrollTop+=(gr.top-gsr.top)/z-16}
    else if(el.closest('.tvscroll,.gwrap')){el.scrollIntoView({block:'center',inline:'nearest'})}
    else{var sec=el.closest('.sec')||el;sec.scrollIntoView({block:'start',inline:'nearest'});el.scrollIntoView({block:'nearest',inline:'nearest'})}
  }catch(e){el.scrollIntoView(false)}
  /* the fixed TV frame itself never moves */
  var m=document.querySelector('.tvmain');if(m){m.scrollTop=0;m.scrollLeft=0}
  if(document.querySelector('.tvmain')&&document.scrollingElement)document.scrollingElement.scrollTop=0;
}
function focusKey(el){if(!el||!el.attributes)return null;for(var i=0;i<el.attributes.length;i++){var n=el.attributes[i].name;if(n.indexOf('data-')===0&&n!=='data-confirm')return '['+n+'="'+String(el.attributes[i].value).replace(/"/g,'\\"')+'"]'}return el.id?'#'+el.id:null}
var autoEl=null;
function keepFocus(fn){
  if(!TV)return fn();
  var k=document.activeElement===autoEl?null:focusKey(document.activeElement);fn();
  setTimeout(function(){
    var sc=navScope(),a=document.activeElement;
    if(a&&a!==autoEl&&a!==document.body&&document.contains(a)&&sc.contains(a)&&visibleEl(a)){tvEnsure(a);return}
    var el=k&&sc.querySelector(k);
    if(el&&visibleEl(el)){try{el.focus({preventScroll:true})}catch(e){}tvEnsure(el);return}
    /* first useful item: the main button of a sheet or of the billboard, else the first item of the page */
    var L=focusables(),pick=(TV&&!sheet&&$('main.welcome #accform input:not([type=hidden])'))||(TV&&!sheet&&[].filter.call(document.querySelectorAll('.tvtile,.tvmainc .poster,.tvmainc .ch .logo,.tvkb .key,.tvrows .poster,.tvrows .tvchc'),visibleEl)[0])||L.filter(function(x){return x.matches('.btn:not(.ghost)')&&!x.closest('.top,.tvtop')})[0]||L.filter(function(x){return !x.closest('#nav')&&!x.closest('.top,.tvtop')&&!x.matches('[data-close].x,.iconbtn.x')})[0]||L[0];
    if(pick){focusEl(pick);autoEl=pick.closest('.top,.tvtop,#nav')?pick:null}
  },0);
}
/* back: closes the sheet, the profile picker, returns home, then leaves the app */
function goBack(){
  if(NXT){cancelNext();return true}
  if(!$('#tvplayer').hidden){tvStop();return true}
  if(!$('#webplayer').hidden)return true;
  if(sheet){var op=sheet.opener;closeSheet();if(TV){var oe=op&&document.querySelector(op);if(oe&&visibleEl(oe)){focusEl(oe);setTimeout(function(){var a=document.activeElement;if(a===oe||!document.contains(oe))tvEnsure(document.activeElement)},60)}else keepFocus(function(){})}return true}
  if(S.pickProfile&&S.profileId){S.pickProfile=false;S.profEdit=false;render();return true}
  if(S.tab!=='home'){S.tab='home';render();window.scrollTo(0,0);return true}
  return false;
}
function exitApp(){if(NATIVE)window.Capacitor.nativePromise('App','exitApp',{});else if(TIZEN){try{tizen.application.getCurrentApplication().exit()}catch(e){try{tizen.application.getCurrentApplication().hide()}catch(x){}}}}
/* on a TV, « Retour » at the top level asks before leaving */
function backOrExit(){if(goBack())return;if(TV&&!(sheet&&sheet.kind==='exit')){openSheet({kind:'exit'});return}exitApp()}
document.addEventListener('keydown',function(e){
  var k=e.key,c=e.keyCode;
  if(!$('#tvplayer').hidden){tvKey(e);e.stopPropagation();return}
  if(c===10009||k==='Escape'||k==='GoBack'||k==='BrowserBack'){e.preventDefault();e.stopPropagation();backOrExit();return}
  if(!TV)return;
  if((k==='Enter'||c===13)&&(!document.activeElement||document.activeElement===document.body)){e.preventDefault();moveFocus('down');return}
  var dir={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[k]||{38:'up',40:'down',37:'left',39:'right'}[c];
  if(!dir)return;
  var a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&(dir==='left'||dir==='right')){var v=a.value||'';try{if(dir==='left'&&a.selectionStart>0)return;if(dir==='right'&&a.selectionEnd<v.length)return}catch(x){}}
  /* a select only changes with OK (its own list); the arrows keep moving through the page */
  if(a&&a.tagName==='SELECT'&&!TV&&(dir==='up'||dir==='down'))return;
  /* never let the browser / the TV scroll the page or move the focus by itself: the menu would slide away */
  e.preventDefault();moveFocus(dir);tvPin();
},true);
/* TV: the frame never scrolls (only the lists inside it do), whatever asked for it */
function tvPin(){
  /* only the fixed TV frame is pinned; the welcome form and the profile screen scroll normally */
  if(!TV||!document.querySelector('.tvmain'))return;var se=document.scrollingElement||document.documentElement;
  [se,document.documentElement,document.body,$('#app'),document.querySelector('.tvmain'),document.querySelector('.tvbrowse'),document.querySelector('.tvmainc')].forEach(function(x){if(x&&(x.scrollTop||x.scrollLeft)){x.scrollTop=0;x.scrollLeft=0}});
}
document.addEventListener('scroll',function(e){if(!TV||!$('#tvplayer').hidden)return;var t=e.target;if(t===document||t===document.documentElement||t===document.body||(t.id&&t.id==='app')||(t.classList&&(t.classList.contains('tvmain')||t.classList.contains('tvbrowse')||t.classList.contains('tvmainc'))))tvPin()},true);
var lastFocus=null;
document.addEventListener('focusin',function(e){if(TV&&e.target&&e.target!==document.body)lastFocus=e.target});
if(TV)document.body.classList.add('tv');
if(NATIVE)nat('deviceInfo').then(function(r){if(r&&r.tv&&!TV){TV=true;document.body.classList.add('tv');MINI.muted=false;tvScale();render()}},function(){});

/* ---------- start ---------- */
/* TV: optionally start on the last channel watched */
function tvAutoStart(){
  if(!TV||PREFS.tvStart!=='last'||tvAutoStart.done||S.pickProfile||!S.profileId||!DATA||!USER||!USER.recent||!USER.recent.length)return;
  var x=byId('live',USER.recent[0]);tvAutoStart.done=true;if(!x)return;S.tab='live';render();playLive(x);
}
function refreshTrends(){loadTrends(false).then(function(t){if(t&&DATA&&!sheet){softRender()}})}
setTimeout(refreshTrends,1200);setTimeout(function(){authPing(false)},2500);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')refreshTrends()});
if(NATIVE)setTimeout(function(){checkUpdate(false)},5000);
render();
kget('prefs').then(function(p){if(p)PREFS=Object.assign(PREFS,p)});
var syncReady=kget('sync').then(function(c){if(c&&c.key&&window.crypto&&crypto.subtle){SYNC=c;return crypto.subtle.importKey('raw',b64d(c.key),{name:'AES-GCM'},true,['encrypt','decrypt']).then(function(k){syncKey=k})}}).catch(function(){});
setTimeout(function(){syncReady.then(function(){syncNow(false)})},2500);
setInterval(function(){if(!document.hidden)syncNow(false)},60000);
document.addEventListener('visibilitychange',function(){if(!SYNC)return;if(document.visibilityState==='visible')syncNow(false);else if(syncT){syncNow(false)}});
kget('accounts').then(function(r){
  if(r&&r.del)S.accDel=r.del;
  if(r&&r.list&&r.list.length){S.accounts=r.list;S.activeId=r.active&&r.list.some(function(a){return a.id===r.active})?r.active:r.list[0].id;return migrateProfiles().then(function(){return switchAccount(S.activeId)})}
  return migrateProfiles();
}).catch(function(){}).then(function(){S.boot=false;render();tvAutoStart()});
setTimeout(function(){if(S.boot){S.boot=false;render()}},10000);
})();
