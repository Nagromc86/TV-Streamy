<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<title>TV Streamy</title>
<style>/*@@FONTS@@*/</style>
<style>
/* Layout: streaming-app look — billboard on top, horizontal rows by category, landscape "resume" cards, full-height detail sheets, bottom tab bar */
:root{
  --bg:#101014; --surface:#1b1b22; --surface2:#26262f; --ink:#f5f5f7; --muted:#a4a4b0; --line:#2d2d38;
  --accent:#e50914; --accent2:#ff3d47; --gold:#f5c518; --ok:#46d39a; --live:#ff3d47;
  --display:"Bricolage Grotesque","Arial Narrow",ui-sans-serif,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --navh:62px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg{flex:none}

/* top bar: transparent over the billboard, solid once scrolled */
.top{position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(rgba(16,16,20,.85),rgba(16,16,20,0));transition:background .2s}
.top.solid{background:rgba(16,16,20,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top.over{position:fixed;left:0;right:0}
.top .in{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;flex:none;color:var(--ink)}
.brand svg{width:26px;height:26px;color:var(--accent)}
.acc{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.12);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.86rem;min-height:36px;max-width:100%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill svg{width:16px;height:16px}
.upd{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);white-space:nowrap}
.upd i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin 1s linear infinite}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.searchbar{display:flex;gap:8px;padding-bottom:10px}
.searchbar input{flex:1;min-width:0;font:inherit;font-size:16px;background:var(--surface2);color:var(--ink);border:0;border-radius:8px;padding:11px 14px}

main{padding-bottom:calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px));min-height:100vh}
.sec{margin-top:22px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sech h2{margin:0;font-family:var(--body);font-weight:700;font-size:1.12rem;letter-spacing:-.01em}
.sech .more{border:0;background:none;color:var(--muted);font-weight:600;font-size:.84rem;padding:4px 0}
.muted{color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty p{margin:0;max-width:36ch}

/* billboard */
.bill{position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(70px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 6px;overflow:hidden;text-align:center}
.bill .bg{position:absolute;inset:-30px;background:var(--surface) center/cover no-repeat;filter:blur(28px) saturate(1.2);opacity:.55;transform:scale(1.1)}
.bill .bg.sharp{inset:0;filter:none;opacity:.9;transform:none}
.bill::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(16,16,20,.2) 0%,rgba(16,16,20,0) 30%,rgba(16,16,20,.55) 70%,var(--bg) 100%)}
.bill .card{position:relative;z-index:1;display:block;width:min(64vw,300px);aspect-ratio:2/3;margin:0 auto;border-radius:12px;overflow:hidden;background:var(--surface2);box-shadow:0 18px 40px rgba(0,0,0,.6);border:0;padding:0}
.bill .card img{width:100%;height:100%;object-fit:cover;display:block}
.bill .card .ph{display:flex;align-items:center;justify-content:center;height:100%;padding:16px;font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.05}
.bill .info{position:relative;z-index:1;margin-top:14px}
.bill h1{margin:0 0 6px;font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.bill .tags{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 10px;font-size:.85rem;color:#d7d7de}
.bill .tags span+span::before{content:"•";margin-right:10px;color:var(--accent2)}
.bill .acts{justify-content:center;margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:#fff;border-radius:4px;padding:2px 6px}

/* rows & grids */
.row{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));padding-bottom:4px;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.row::-webkit-scrollbar{display:none}
.poster{flex:none;width:108px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;position:relative}
.poster .art{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.poster .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.poster .ph{font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--muted);padding:8px;text-align:center;line-height:1.1}
.poster .t{display:none}
.poster.labeled .t{display:block;margin-top:6px;font-size:.8rem;font-weight:600;line-height:1.2;max-height:2.4em;overflow:hidden;color:#d7d7de}
.poster .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25)}
.poster .bar i{display:block;height:100%;background:var(--accent)}
.poster .rate{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.75);color:var(--gold);font-weight:800;font-size:.7rem;border-radius:4px;padding:1px 5px}
.poster .fav{position:absolute;top:5px;right:5px;color:#fff}
.poster .fav svg{width:15px;height:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
.poster .new{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);white-space:nowrap}
.top10{display:flex;align-items:flex-end;flex:none;scroll-snap-align:start;border:0;background:none;padding:0}
.top10 .rk{font-family:var(--display);font-weight:800;font-size:5.4rem;line-height:.8;color:var(--bg);-webkit-text-stroke:2px #8a8a96;margin-right:-14px;position:relative;z-index:0;letter-spacing:-.06em}
.top10 .poster{z-index:1}
.wide{flex:none;width:228px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left}
.wide .art{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--surface2)}
.wide .art img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.wide .art::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 45%,rgba(0,0,0,.75))}
.wide .pl{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.wide .pl svg{width:18px;height:18px;margin-left:2px}
.wide .lab{position:absolute;z-index:1;left:8px;right:8px;bottom:10px;font-size:.8rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wide .bar{position:absolute;z-index:1;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25)}
.wide .bar i{display:block;height:100%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px 8px}
.grid .poster{width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #4a4a56;background:transparent;border-radius:999px;padding:6px 13px;font-size:.84rem;font-weight:600;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#111}
.chip b{font-weight:500;opacity:.65;margin-left:4px;font-size:.76rem}
.freshness{display:flex;align-items:center;justify-content:space-between;gap:10px;white-space:nowrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.freshness button{border:0;background:none;color:var(--ink);font-weight:700;font-size:.8rem;display:inline-flex;align-items:center;gap:5px;padding:4px 0}
.freshness svg{width:14px;height:14px}
.pagehead{padding-top:calc(4px);display:flex;align-items:baseline;gap:10px}
.pagehead h1{margin:0;font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.01em}

/* channels */
.chlist{display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:10px;background:var(--surface)}
.logo{width:76px;height:52px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border:0;padding:4px}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.logo .ph{font-family:var(--display);font-weight:800;font-size:.95rem;color:#333}
.ch .n{min-width:0;border:0;background:none;padding:0;text-align:left}
.ch .n b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .epg{display:block;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .epg em{font-style:normal;color:var(--ink)}
.ch .prog{display:block;height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.ch .prog i{display:block;height:100%;background:var(--accent)}
.star{border:0;background:none;padding:8px;color:var(--muted)}
.star.on{color:var(--ink)}
.star svg{width:22px;height:22px}
.livetag{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--live)}
.livetag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live)}
.morebtn{display:block;margin:14px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600}

/* buttons: primary is white like streaming apps */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:#fff;color:#111;border-radius:6px;padding:10px 18px;font-weight:700;min-height:44px;text-decoration:none;font-size:.98rem}
.btn.ghost{background:rgba(255,255,255,.16);color:var(--ink)}
.btn.danger{background:transparent;color:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent2)}
.btn.red{background:var(--accent);color:#fff}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(16,16,20,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{display:grid;grid-template-columns:repeat(5,1fr);height:var(--navh);max-width:720px;margin:0 auto}
#nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.7rem;font-weight:600;color:#8a8a96}
#nav button svg{width:22px;height:22px}
#nav button[aria-current="page"]{color:var(--ink)}

/* detail sheet: near full height, big image header */
#sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:720px;max-height:96%;overflow-y:auto;border-radius:14px 14px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.panel.full{height:96%}
.hero{position:relative;aspect-ratio:16/10;max-height:340px;width:100%;background:var(--surface2) center 20%/cover no-repeat;border-radius:14px 14px 0 0;overflow:hidden}
.hero.blur::before{content:"";position:absolute;inset:-20px;background:inherit;background-size:cover;filter:blur(18px);opacity:.7}
.hero .thumb{position:absolute;z-index:1;left:50%;bottom:14px;transform:translateX(-50%);height:78%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.6);background:var(--surface2)}
.hero .thumb img{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(27,27,34,0) 55%,var(--surface) 100%);z-index:1}
.hero.noimg{aspect-ratio:auto;height:58px;background:none}
.hero.noimg::after,.hero.noimg::before{display:none}
.hero .x{position:absolute;top:10px;right:10px;z-index:2;background:rgba(0,0,0,.6)}
.panel .in{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.panel .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.panel h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.05;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;color:var(--muted);font-size:.86rem}
.meta b{color:var(--ok)}
.meta .imdb{background:var(--gold);color:#111;font-weight:800;border-radius:4px;padding:0 5px;font-size:.78rem}
.plot{margin:0;color:#d9d9e0;font-size:.95rem;max-width:65ch}
.panel .acts .btn{flex:1 1 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ep{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.epplay{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 0;background:none;border:0;text-align:left;min-width:0}
.ep .num{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--muted);min-width:2ch;text-align:right}
.ep b{display:block;font-weight:600}
.ep small{color:var(--muted)}
.ep .bar{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden;max-width:160px}
.ep .bar i{display:block;height:100%;background:var(--accent)}
.ep .seen{color:var(--ok);font-size:.78rem;font-weight:600}
.epdl{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;height:40px;border-radius:8px;border:0;background:var(--surface2);color:var(--ink);font-size:.75rem;font-weight:700;padding:0 8px}
.epdl svg{width:18px;height:18px}
.epdl.done{color:var(--ok)}
.epdl.warn{color:var(--accent2)}
.dlrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dlrow .art{width:52px;aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:var(--surface2)}
.dlrow .art img{width:100%;height:100%;object-fit:cover}
.dlrow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlrow small{display:block;color:var(--muted)}
.dlrow small.ok{color:var(--ok)}
.dlbar{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.dlbar i{display:block;height:100%;background:var(--accent)}
.dlacts{display:flex;gap:6px}
.offline{background:var(--surface2);border-radius:8px;padding:8px 12px;font-size:.86rem;margin-top:8px}
.chk{display:flex;align-items:flex-start;gap:10px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}

/* forms */
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:.76rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select{font:inherit;font-size:16px;background:var(--surface2);color:var(--ink);border:1px solid transparent;border-radius:6px;padding:12px;width:100%}
.fld input:focus,.fld select:focus{border-color:#fff;outline:none}
.hint{font-size:.8rem;color:var(--muted)}
.err{color:var(--accent2);font-size:.9rem;margin:0}
.okmsg{color:var(--ok);font-size:.9rem;margin:0}
.accrow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--surface2)}
.accrow.on{box-shadow:inset 0 0 0 2px #fff}
.accrow .n{flex:1;min-width:0}
.accrow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accrow small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.updrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.updrow b{display:block}
.updrow small{color:var(--muted)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:80px 16px;color:var(--muted);text-align:center}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));z-index:200;background:#fff;color:#111;font-weight:600;padding:10px 14px;border-radius:8px;font-size:.9rem;max-width:min(92vw,520px)}
#webplayer{position:fixed;inset:0;z-index:150;background:#000;display:flex;flex-direction:column}
#webplayer video{flex:1;width:100%;min-height:0;background:#000}
#webplayer .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
#webplayer .bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.welcome h1{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.02;margin:24px 0 8px;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.spin,.upd i{animation-duration:3s}}
@media (min-width:700px){.poster{width:140px}.wide{width:300px}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.bill .card{width:240px}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden></nav>
<div id="sheet" hidden></div>
<div id="webplayer" hidden></div>
<div id="toast" role="status" hidden></div>
<script>
(function(){
"use strict";
var APP_VERSION='/*@@VERSION@@*/';
var $=function(s,r){return (r||document).querySelector(s)};
var NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
var IC={
  filter:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  tv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>',
  film:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4M3 12h18"/></svg>',
  series:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M6 3h12M9 11l5 3-5 3z"/></svg>',

var UQ=new WeakMap(),VX=new WeakMap();

function rawCats(kind){var k=secOf(kind);return k==='live'?DATA.liveCats:k==='vod'?DATA.vodCats:DATA.serCats}
function grpOf(name){var m=/^\s*[\[(]?([A-Za-z]{2,4}(?:[ \-][A-Za-z]{2,4})?)[\])]?\s*[★✪✰☆⭐|:•\-–»]/.exec(name||'');return m?m[1].toUpperCase().replace(/\s+/g,' '):'Autres'}
function hidG(kind){return (USER.hidden&&USER.hidden[secOf(kind)])||{}}
function hidSig(kind){return Object.keys(hidG(kind)).sort().join(',')}
var VZ=new WeakMap(),VL=new WeakMap();
function visCats(kind){
  var h=hidG(kind),sig=hidSig(kind),C=rawCats(kind),c=VZ.get(C);if(c&&c.sig===sig)return c.v;
  var v=sig?C.filter(function(x){return !h[grpOf(x.category_name)]}):C;VZ.set(C,{sig:sig,v:v});return v;
}
function visList(kind){
  var L=rawList(kind),sig=hidSig(kind),c=VL.get(L);if(c&&c.sig===sig)return c.v;
  var v;
  if(!sig)v=uniq(L);
  else{var bad={};rawCats(kind).forEach(function(x){if(hidG(kind)[grpOf(x.category_name)])bad[x.category_id]=1});v=dedupe(L.filter(function(x){return !bad[x.category_id]}))}
  VL.set(L,{sig:sig,v:v});return v;
}
function groupsOf(kind){
  var C=rawCats(kind),per={},g={};
  rawList(kind).forEach(function(x){per[x.category_id]=(per[x.category_id]||0)+1});
  C.forEach(function(c){var k=grpOf(c.category_name);g[k]=g[k]||{name:k,cats:0,n:0,ex:[]};g[k].cats++;g[k].n+=per[c.category_id]||0;if(g[k].ex.length<3)g[k].ex.push(c.category_name)});
  return Object.keys(g).map(function(k){return g[k]}).filter(function(x){return x.n}).sort(function(a,b){return b.n-a.n});
}
function nf(n){return Number(n).toLocaleString('fr-FR')}
function filtered(kind,cat){
  var L=visList(kind);
  if(cat==='fav')return L.filter(function(x){return isFav(kind,x.stream_id||x.series_id)});
  if(cat!=='all')return dedupe((kind==='live'?DATA.live:kind==='movie'?DATA.vod:DATA.series).filter(function(x){return String(x.category_id)===String(cat)}));
  return L;
}

function viewFavs(){

  var live=F.filter(function(f){return f.kind==='live'}).map(function(f){return byId('live',f.id)}).filter(Boolean);
  var mv=F.filter(function(f){return f.kind==='movie'}).map(function(f){return byId('movie',f.id)}).filter(Boolean);
  var se=F.filter(function(f){return f.kind==='series'}).map(function(f){return byId('series',f.id)}).filter(Boolean);

  if(!live.length&&!mv.length&&!se.length)return h+'<div class="empty" style="margin-top:20px"><p>Pas encore de favoris. Touche l\'étoile d\'une chaîne, d\'un film ou d\'une série'+(NATIVE?', ou télécharge un film pour le regarder hors connexion':'')+'.</p></div>';

function parseM3uLink(v){

      ((info.director||info.cast||info.actors)?'<p class="hint">'+(info.director?'Réalisation : '+esc(info.director)+'<br>':'')+((info.cast||info.actors)?'Avec : '+esc(info.cast||info.actors):'')+'</p>':'')+
      '<div class="acts">'+(p&&!p.done?'<button type="button" class="btn" data-playmovie="'+esc(x.stream_id)+'">'+IC.play+'Reprendre à '+dur(p.pos)+'</button><button type="button" class="btn ghost" data-playmovie="'+esc(x.stream_id)+'" data-start="1">Depuis le début</button>':'<button type="button" class="btn" data-playmovie="'+esc(x.stream_id)+'">'+IC.play+'Lecture</button>')+
      '<button type="button" class="btn ghost" data-fav="movie:'+esc(x.stream_id)+'">'+(isFav('movie',x.stream_id)?IC.starOn+'Dans mes favoris':IC.star+'Ajouter aux favoris')+'</button>'+movieDlHtml(x)+'</div>'+
      (p&&p.done?'<p class="okmsg">Déjà vu.</p>':'')+versionsHtml('movie',x)+'</div>';
    if(!sheet.loading)checkSubs('movie:'+x.stream_id,subMeta('movie',x,info));
  }else if(sheet.kind==='series'){
    var s=sheet.item,si=sheet.info||{},inf=si.info||{},eps=si.episodes||{},seasons=Object.keys(eps).sort(function(a,b){return a-b});
    if(!sheet.season||!eps[sheet.season])sheet.season=seasons[0];
    var sp=USER.prog['series:'+s.series_id],nextEp=sp?resumeEpisode(sp):null;
    var bgs=(inf.backdrop_path&&inf.backdrop_path[0])||(s.backdrop_path&&s.backdrop_path[0])||inf.cover||s.cover;
    var rs=parseFloat(inf.rating||s.rating);
    h+='<div class="hero'+(bgs?'':' noimg')+'" style="background-image:url(\''+esc(bgs||'')+'\')"><button type="button" class="iconbtn x" data-close aria-label="Fermer">'+IC.x+'</button></div><div class="in gut"><h2>'+esc(cleanName(inf.name||s.name))+'</h2>'+
      '<div class="meta">'+(rs>0?'<b>★ '+rs.toFixed(1)+'</b>':'')+(year(inf.releaseDate||s.releaseDate)?'<span>'+year(inf.releaseDate||s.releaseDate)+'</span>':'')+(seasons.length?'<span>'+seasons.length+' saison'+(seasons.length>1?'s':'')+'</span>':'')+((inf.genre||s.genre)?'<span>'+esc(inf.genre||s.genre)+'</span>':'')+subAvailHtml('series:'+s.series_id)+'</div>'+
      ((inf.plot||s.plot)?'<p class="plot">'+esc(inf.plot||s.plot)+'</p>':'')+
      '<div class="acts">'+(nextEp?'<button type="button" class="btn" data-playep="'+esc(nextEp.ep.id)+'">'+IC.play+(nextEp.resume?'Reprendre ':'Regarder ')+esc(nextEp.label)+'</button>':'')+
      '<button type="button" class="btn ghost" data-fav="series:'+esc(s.series_id)+'">'+(isFav('series',s.series_id)?IC.starOn+'Dans mes favoris':IC.star+'Ajouter aux favoris')+'</button></div>'+versionsHtml('series',s);
    if(!sheet.loading)checkSubs('series:'+s.series_id,subMeta('series',s,inf));
    if(sheet.loading)h+='<p class="hint">Chargement des épisodes…</p>';
    if(seasons.length){
      h+='<div class="tabs">'+seasons.map(function(n){return '<button type="button" class="chip" data-season="'+esc(n)+'" aria-pressed="'+(String(n)===String(sheet.season))+'">Saison '+esc(n)+'</button>'}).join('')+'</div><div>';
      (eps[sheet.season]||[]).forEach(function(ep){
        var pe=progressOf('ep:'+ep.id),pc=pe&&pe.dur&&!pe.done?Math.min(100,pe.pos/pe.dur*100):0,ei=ep.info||{};
        var dk='ep:'+ep.id,dd=dlOf(dk),dlb='';
        if(NATIVE){
          if(sheet.confirmDl===dk)dlb='<button type="button" class="epdl warn" data-dlrm="'+esc(dk)+'">Supprimer ?</button>';
          else if(!dd)dlb='<button type="button" class="epdl" data-dlep="'+esc(ep.id)+'" aria-label="Télécharger l\'épisode">'+IC.dl+'</button>';
          else if(dd.status==='done')dlb='<button type="button" class="epdl done" data-dlask="'+esc(dk)+'" aria-label="Téléchargé">'+IC.check+'</button>';
          else if(dd.status==='failed')dlb='<button type="button" class="epdl warn" data-dlask="'+esc(dk)+'">Échec</button>';
          else dlb='<button type="button" class="epdl" data-dlask="'+esc(dk)+'">'+(dd.total?Math.floor(dd.bytes/dd.total*100)+' %':'…')+'</button>';
        }
        h+='<div class="ep"><button type="button" class="epplay" data-playep="'+esc(ep.id)+'"><span class="num">'+esc(ep.episode_num)+'</span><span><b>'+esc(ep.title||('Épisode '+ep.episode_num))+'</b>'+(ei.duration?'<small>'+esc(ei.duration)+'</small>':'')+(pe&&pe.done?' <span class="seen">· vu</span>':'')+(dd&&dd.status==='done'?' <span class="seen">· hors connexion</span>':'')+(pc?'<span class="bar"><i style="width:'+pc.toFixed(0)+'%"></i></span>':'')+'</span></button>'+dlb+'</div>';
      });
      h+='</div>';
    }else if(!sheet.loading)h+='<p class="hint">Aucun épisode trouvé pour cette série.</p>';
    h+='</div>';
  }
  h+='</div>';
  el.innerHTML=h;el.hidden=false;document.body.style.overflow='hidden';
}
function movieDlHtml(x){
  if(!NATIVE)return '';
  var k='movie:'+x.stream_id,d=dlOf(k);
  if(sheet&&sheet.confirmDl===k)return '<button type="button" class="btn danger" data-dlrm="'+esc(k)+'">Confirmer la suppression</button>';
  if(!d)return '<button type="button" class="btn ghost" data-dlmovie="'+esc(x.stream_id)+'">'+IC.dl+'Télécharger</button>';
  if(d.status==='done')return '<button type="button" class="btn ghost" data-dlask="'+esc(k)+'" style="color:var(--ok)">'+IC.check+esc(dlLabel(d))+'</button>';
  return '<button type="button" class="btn ghost" data-dlask="'+esc(k)+'">'+esc(dlLabel(d))+'</button>';
}
function allEpisodes(){var e=(sheet&&sheet.info&&sheet.info.episodes)||{};var out=[];Object.keys(e).sort(function(a,b){return a-b}).forEach(function(s){(e[s]||[]).forEach(function(ep){ep.season=ep.season||s;out.push(ep)})});return out}
function nextEpisode(ep){var L=allEpisodes();for(var i=0;i<L.length;i++)if(String(L[i].id)===String(ep.id))return L[i+1]||null;return null}
function resumeEpisode(sp){
  var L=allEpisodes();if(!L.length)return null;
  var i=L.findIndex(function(e){return String(e.id)===String(sp.last)});
  if(i<0)return null;
  var cur=L[i],pe=progressOf('ep:'+cur.id);
  var lab=function(e){return 'S'+String(e.season).padStart(2,'0')+'E'+String(e.episode_num).padStart(2,'0')};
  if(pe&&!pe.done&&pe.pos>0)return{ep:cur,label:lab(cur),resume:true};
  var n=L[i+1];return n?{ep:n,label:lab(n),resume:false}:null;
}
function openItem(kind,id){
  var x=byId(kind,id);if(!x)return;
  if(kind==='live'){playLive(x);return}
  openSheet({kind:kind,item:x,loading:true});
  var p=kind==='movie'?api(acc(),'action=get_vod_info&vod_id='+id):api(acc(),'action=get_series_info&series_id='+id);
  var ck='info:'+S.activeId+':'+kind+':'+id;
  p.then(function(r){kset(ck,r);return r},function(e){return kget(ck).then(function(c){if(c)return c;throw e})}).then(function(r){if(!sheet||sheet.item!==x)return;sheet.loading=false;sheet.info=kind==='movie'?(r&&r.info)||{}:r||{};renderSheet()},function(e){if(!sheet||sheet.item!==x)return;sheet.loading=false;sheet.info={};renderSheet();if(navigator.onLine!==false)toast('Fiche indisponible : '+errText(e))});
}

/* ---------- account save ---------- */
function submitAccount(form){
  var g=function(n){return (form.elements[n].value||'').trim()};
  var a={id:form.getAttribute('data-id')||uid(),name:g('name'),server:g('server'),username:g('username'),password:form.elements.password.value,format:g('format')};
  if(a.server&&!/^https?:\/\//i.test(a.server))a.server='http://'+a.server;
  var m=parseM3uLink(a.server);if(m){a.server=m.server;if(!a.username)a.username=m.username;if(!a.password)a.password=m.password}
  a.server=cleanServer(a.server);
  var err=$('#accerr',form),ok=$('#accok',form);err.hidden=true;ok.hidden=true;
  if(!a.server||!a.username||!a.password){err.textContent='Remplis l\'adresse du serveur, l\'identifiant et le mot de passe.';err.hidden=false;return}
  if(!a.name)a.name=a.server.replace(/^https?:\/\//,'').replace(/:\d+$/,'');
  var btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Connexion…';
  api(a,'').then(function(r){
    var ui=r&&r.user_info;
    if(!ui||String(ui.auth)!=='1')throw new Error('identifiant ou mot de passe refusé par le serveur.');
    if(ui.status&&ui.status!=='Active')throw new Error('abonnement « '+ui.status+' ».');
    var exp=+ui.exp_date;a.info=(exp?'Expire le '+new Date(exp*1000).toLocaleDateString('fr-FR'):'Sans date d\'expiration')+(ui.max_connections?' · '+ui.max_connections+' écran'+(ui.max_connections>1?'s':''):'');
    var i=S.accounts.findIndex(function(x){return x.id===a.id});
    var changed=i<0||S.accounts[i].server!==a.server||S.accounts[i].username!==a.username||S.accounts[i].password!==a.password;
    if(i<0)S.accounts.push(a);else S.accounts[i]=a;
    closeSheet();
    if(changed){kdel('cat:'+a.id);return switchAccount(a.id)}
    saveAccounts();render();
  }).catch(function(e){err.textContent='Connexion refusée : '+errText(e);err.hidden=false;btn.disabled=false;btn.textContent='Réessayer'});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-dlmovie],[data-dlep],[data-dlask],[data-dlrm],[data-dlplay],[data-tab],[data-open],[data-play],[data-fav],[data-lcat],[data-vcat],[data-scat],[data-more],[data-accounts],[data-addacc],[data-editacc],[data-useacc],[data-delacc],[data-refresh],[data-retry],[data-groups],[data-gall],[data-checkupd],[data-getapk],[data-close],[data-playmovie],[data-playep],[data-season]');
  if(!t){if(e.target.id==='sheet')closeSheet();return}
  var d=t.dataset;
  if(d.dlmovie){var dm=byId('movie',d.dlmovie);if(dm)startDownload('movie:'+dm.stream_id,streamUrl('movie',dm),dm.container_extension,{kind:'movie',id:dm.stream_id,title:cleanName(dm.name),icon:dm.stream_icon,subMeta:subMeta('movie',dm,sheet&&sheet.item===dm?sheet.info:null)});return}
  if(d.dlep){var de=allEpisodes().filter(function(x){return String(x.id)===String(d.dlep)})[0],ds=sheet&&sheet.item;
    if(de&&ds){var lb='S'+String(de.season).padStart(2,'0')+'E'+String(de.episode_num).padStart(2,'0');
      startDownload('ep:'+de.id,streamUrl('episode',de),de.container_extension,{kind:'ep',id:de.id,title:cleanName(ds.name)+' · '+lb,icon:ds.cover,
        ep:{id:de.id,season:de.season,episode_num:de.episode_num,title:de.title,container_extension:de.container_extension},series:{series_id:ds.series_id,name:ds.name,cover:ds.cover},subMeta:subMeta('series',ds,sheet.info&&sheet.info.info,de)})}
    return}
  if(d.dlask){if(sheet)sheet.confirmDl=d.dlask;else S.confirmDl=d.dlask;if(sheet)renderSheet();else render();return}
  if(d.dlrm){if(sheet)sheet.confirmDl=null;S.confirmDl=null;removeDownload(d.dlrm);return}
  if(d.dlplay){var pd=dlOf(d.dlplay);if(!pd)return;
    if(pd.kind==='movie'){var pm=byId('movie',pd.id)||{stream_id:pd.id,name:pd.title,stream_icon:pd.icon};playMovie(pm,false)}
    else if(pd.ep&&pd.series)playEpisode(pd.series,pd.ep,false);
    return}
  if(d.tab){S.confirmDl=null;if(d.tab===S.tab&&d.tab==='movies')S.vodCat='all';if(d.tab===S.tab&&d.tab==='series')S.serCat='all';S.tab=d.tab;if(d.tab!=='search')S.q=S.q;render();window.scrollTo(0,0);if(d.tab==='search')setTimeout(function(){var q=$('#q');if(q)q.focus()},30);return}
  if(d.open){var p=d.open.split(':');openItem(p[0],p.slice(1).join(':'));return}
  if(d.play){var pl=d.play.split(':');var x=byId(pl[0],pl.slice(1).join(':'));if(x)playLive(x);return}
  if(d.fav){var f=d.fav.split(':'),it=byId(f[0],f.slice(1).join(':'));if(it){toggleFav(f[0],it);render();if(sheet)renderSheet()}return}
  if(d.lcat){S.liveCat=d.lcat;render();return}
  if(d.vcat){S.vodCat=d.vcat;if(d.goto)S.tab=d.goto;render();window.scrollTo(0,0);return}
  if(d.scat){S.serCat=d.scat;if(d.goto)S.tab=d.goto;render();window.scrollTo(0,0);return}
  if(d.more){S.limit[d.more]=(S.limit[d.more]||60)+60;var y=window.scrollY;render();window.scrollTo(0,y);return}
  if(t.hasAttribute('data-checkupd')){checkUpdate(true);return}
  if(t.hasAttribute('data-getapk')){openExternal(APK_URL);toast('Téléchargement de la mise à jour…');return}
  if(d.groups){openSheet({kind:'groups',sec:d.groups,back:sheet&&sheet.kind==='accounts'});return}
  if(d.gall){var gk=sheet.sec;USER.hidden=USER.hidden||{};USER.hidden[gk]={};if(d.gall==='0')groupsOf(gk).forEach(function(g){USER.hidden[gk][g.name]=1});groupsChanged(gk);return}
  if(t.hasAttribute('data-accounts')){openSheet({kind:'accounts'});return}
  if(t.hasAttribute('data-addacc')){openSheet({kind:'accform',acc:{}});return}
  if(d.editacc){var a=S.accounts.filter(function(x){return x.id===d.editacc})[0];if(a)openSheet({kind:'accform',acc:a});return}
  if(d.useacc){closeSheet();switchAccount(d.useacc);return}
  if(d.delacc){
    if(t.getAttribute('data-confirm')!=='1'){t.setAttribute('data-confirm','1');t.textContent='Confirmer la suppression';return}
    var id=d.delacc;S.accounts=S.accounts.filter(function(x){return x.id!==id});kdel('cat:'+id);kdel('user:'+id);
    closeSheet();
    if(S.activeId===id){S.activeId=S.accounts[0]?S.accounts[0].id:null;DATA=null;saveAccounts();if(S.activeId)switchAccount(S.activeId);else render()}else{saveAccounts();render()}
    return;
  }
  if(d.refresh){refreshSection(d.refresh,true);return}
  if(t.hasAttribute('data-retry')){loadCatalog();return}
  if(t.hasAttribute('data-close')){if(sheet&&sheet.kind==='groups'&&sheet.back){openSheet({kind:'accounts'});return}closeSheet();return}
  if(d.playmovie){var mv=byId('movie',d.playmovie);if(mv)playMovie(mv,d.start==='1');return}
  if(d.playep){var ep=allEpisodes().filter(function(x){return String(x.id)===String(d.playep)})[0];if(ep&&sheet)playEpisode(sheet.item,ep,false);return}
  if(d.season){sheet.season=d.season;renderSheet();return}
});
function groupsChanged(sec){
  saveUser();var k=kindOf(sec),ck=k==='live'?'liveCat':k==='movie'?'vodCat':'serCat';
  if(S[ck]!=='all'&&S[ck]!=='fav'&&!visCats(k).some(function(c){return String(c.category_id)===String(S[ck])}))S[ck]='all';
  renderSheet();clearTimeout(groupsChanged.t);groupsChanged.t=setTimeout(function(){var y=window.scrollY;render();window.scrollTo(0,y)},250);
}
document.addEventListener('change',function(e){
  if(e.target.hasAttribute&&e.target.hasAttribute('data-grp')&&sheet&&sheet.kind==='groups'){var g=e.target.getAttribute('data-grp');USER.hidden=USER.hidden||{};var hs=USER.hidden[sheet.sec]=USER.hidden[sheet.sec]||{};if(e.target.checked)delete hs[g];else hs[g]=1;groupsChanged(sheet.sec);return}if(e.target.id==='subMode'){PREFS.subMode=e.target.value;kset('prefs',PREFS);toast('Réglage des sous-titres enregistré.')}if(e.target.id==='allowMobile'){PREFS.allowMobile=e.target.checked;kset('prefs',PREFS);toast(PREFS.allowMobile?'Les téléchargements utiliseront aussi les données mobiles.':'Les téléchargements attendront le Wi-Fi.')}});
window.addEventListener('online',function(){render()});window.addEventListener('offline',function(){render()});
document.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='accform')submitAccount(e.target);if(e.target.id==='osform')submitOs(e.target)});
function submitOs(f){
  var k=$('#os-key').value.trim(),u=$('#os-user').value.trim(),pw=$('#os-pass').value,err=$('#oserr'),ok=$('#osok');err.hidden=true;ok.hidden=true;
  if(!k){PREFS.os=null;kset('prefs',PREFS);ok.textContent='OpenSubtitles désactivé.';ok.hidden=false;return}
  PREFS.os={key:k,user:u,pass:pw};
  var b=f.querySelector('[type=submit]');b.disabled=true;b.textContent='Test…';
  osReq('/infos/formats').then(function(){return u?osLogin(true):null}).then(function(){
    kset('prefs',PREFS);subAvail={};
    ok.textContent=u?'Connecté'+(PREFS.os.allowed?' : '+PREFS.os.allowed+' sous-titres par jour.':'.'):'Clé valide. Ajoute ton identifiant pour avoir plus de téléchargements par jour.';ok.hidden=false;
  }).catch(function(e){err.textContent='OpenSubtitles : '+errText(e);err.hidden=false}).then(function(){b.disabled=false;b.textContent='Enregistrer et tester'});
}
var qTimer=null;
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;clearTimeout(qTimer);qTimer=setTimeout(render,180)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet)closeSheet()});

/* Android back button */
if(NATIVE){
  try{window.Capacitor.addListener('App','backButton',function(){
    if(!$('#webplayer').hidden)return;
    if(sheet){closeSheet();return}
    if(S.tab!=='home'){S.tab='home';render();window.scrollTo(0,0);return}
    window.Capacitor.nativePromise('App','exitApp',{});
  })}catch(e){}
}

document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')dailyRefresh()});
setInterval(dailyRefresh,60*60*1000);
window.addEventListener('online',function(){dailyRefresh()});

/* ---------- start ---------- */
if(NATIVE)setTimeout(function(){checkUpdate(false)},5000);
render();
kget('prefs').then(function(p){if(p)PREFS=Object.assign(PREFS,p)});
kget('accounts').then(function(r){
  if(r&&r.list&&r.list.length){S.accounts=r.list;S.activeId=r.active&&r.list.some(function(a){return a.id===r.active})?r.active:r.list[0].id;return switchAccount(S.activeId)}
  render();
});
})();
