# Construit l'appli Android TV Streamy (APK) à chaque modification et la publie dans les Releases.
# Lien fixe vers la dernière version : https://github.com/Nagromc86/TV-Streamy/releases/latest/download/tv-streamy.apk
name: APK Android

on:
  push:
    branches: [main]
    paths: ['src/**', 'plugins/**', 'tools/**', 'assets/**', 'package.json', 'capacitor.config.json', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le projet Android
        shell: bash
        run: |
          # en cas d'échec, la fin du journal est remontée en annotation
          fail() { MSG=$(tail -60 "$1" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=$2::$MSG"; exit 1; }
          ( npm install --no-audit --no-fund ) > npm.log 2>&1 || fail npm.log npm
          python3 tools/check_plugin.py > check.log 2>&1 || fail check.log plugin
          python3 tools/build.py node_modules
          ( npx cap add android && npx capacitor-assets generate --android && npx cap sync android ) > cap.log 2>&1 || fail cap.log capacitor
          # les serveurs IPTV et leurs flux sont souvent en http
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          # Xtream accounts must stay on the device: no Google / adb backup of the app's data
          sed -i 's/android:allowBackup="true"/android:allowBackup="false" android:fullBackupContent="false"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml || sed -i 's/<application/<application android:allowBackup="false" android:fullBackupContent="false"/' android/app/src/main/AndroidManifest.xml
          # Android TV: appear in the TV launcher, with a banner
          sed -i 's/<application/<application android:banner="@drawable\/tv_banner"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<category android:name="android.intent.category.LAUNCHER" />#<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />#' android/app/src/main/AndroidManifest.xml
          # phone: the small Direct video goes on in a floating window when the app is left (picture in picture)
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:supportsPictureInPicture="true" android:resizeableActivity="true"/' android/app/src/main/AndroidManifest.xml
          grep -q 'MainActivity" android:supportsPictureInPicture="true"' android/app/src/main/AndroidManifest.xml || { echo "::error title=manifest::PiP non ajouté"; grep -n "activity" android/app/src/main/AndroidManifest.xml; exit 1; }
          # the page must not be rebuilt when the window shrinks
          grep -q 'configChanges="[^"]*smallestScreenSize[^"]*"' android/app/src/main/AndroidManifest.xml && grep -q 'configChanges="[^"]*screenLayout[^"]*"' android/app/src/main/AndroidManifest.xml || { echo "::error title=manifest::configChanges incomplet"; grep -n "configChanges" android/app/src/main/AndroidManifest.xml; exit 1; }
          mkdir -p android/app/src/main/res/drawable-xhdpi && cp assets/tv-banner.png android/app/src/main/res/drawable-xhdpi/tv_banner.png
          grep -q LEANBACK_LAUNCHER android/app/src/main/AndroidManifest.xml || { echo "::error title=manifest::LEANBACK_LAUNCHER non ajouté"; grep -n "category" android/app/src/main/AndroidManifest.xml; exit 1; }
          VERSION=$(grep -o "var APP_VERSION='[0-9][^']*'" www/index.html | head -1 | cut -d"'" -f2)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Compiler l'extension FFmpeg (DTS, E-AC3, TrueHD)
        shell: bash
        run: |
          set -euo pipefail
          # NDK que Media3 utilise aussi pour le module (cohérence des toolchains)
          NDK="$ANDROID_HOME/ndk/25.1.8937393"
          [ -d "$NDK" ] || NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK"
          git clone --depth 1 --branch 1.4.1 https://github.com/androidx/media.git media3src
          FFP="$PWD/media3src/libraries/decoder_ffmpeg/src/main/jni"
          git clone --depth 1 --branch release/6.0 https://github.com/FFmpeg/FFmpeg.git "$FFP/ffmpeg"
          # limiter aux 2 architectures demandées (arm64 + arm32)
          sed -i -E 's/^(ANDROID_ABIS)=\(.*\)/\1=(armeabi-v7a arm64-v8a)/' "$FFP/build_ffmpeg.sh" || true
          echo "== ABIS ciblées =="; grep -nE "^ANDROID_ABIS=" "$FFP/build_ffmpeg.sh" || true
          chmod +x "$FFP/build_ffmpeg.sh"
          echo "== compilation ffmpeg (peut prendre plusieurs minutes) =="
          # args : <module> <ndk> <host> <niveau API min> <décodeurs...>
          (cd "$FFP" && ./build_ffmpeg.sh "$FFP" "$NDK" linux-x86_64 21 dca ac3 eac3 truehd mlp) > ffbuild.log 2>&1 || true
          tail -6 ffbuild.log || true
          if ! ls "$FFP/ffmpeg/android-libs/arm64-v8a/"*.a >/dev/null 2>&1; then
            echo "::error title=ffmpeg::FFmpeg non compilé — voir le log ci-dessous"
            tail -90 ffbuild.log; exit 1
          fi
          echo "== libs ffmpeg produites =="; ls "$FFP/ffmpeg/android-libs/arm64-v8a/"*.a
          ( cd media3src && ./gradlew :lib-decoder-ffmpeg:assembleRelease --no-daemon ) > aar.log 2>&1 || { tail -60 aar.log; exit 1; }
          AAR=$(find media3src/libraries/decoder_ffmpeg -name '*.aar' | grep -i release | head -1)
          echo "AAR=$AAR"; test -n "$AAR"
          mkdir -p plugins/iptv-player/android/libs
          cp "$AAR" plugins/iptv-player/android/libs/media3-ffmpeg.aar
          for p in $(find node_modules -maxdepth 4 -type d -path '*iptv-player/android' 2>/dev/null); do mkdir -p "$p/libs"; cp "$AAR" "$p/libs/media3-ffmpeg.aar"; done
          echo "== .so embarqués =="; unzip -l plugins/iptv-player/android/libs/media3-ffmpeg.aar | grep -E '\.so'

      - name: Construire l'APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace > gradle.log 2>&1 || { MSG=$(grep -E "FAILURE|What went wrong|error:|Error|Exception|> |\.java:" gradle.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=gradle::$MSG"; tail -30 gradle.log; exit 1; }
          tail -5 gradle.log

      - name: Signer l'APK
        shell: bash
        env:
          # Clé rangée dans le coffre secret du dépôt (Settings › Secrets and variables › Actions).
          KS_B64: ${{ secrets.APK_KEYSTORE }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error title=Signature::Ajoute les secrets APK_KEYSTORE et APK_KEYSTORE_PASSWORD dans Settings › Secrets and variables › Actions."; exit 1; fi
          printf %s "$KS_B64" | base64 -d > "$RUNNER_TEMP/key.p12"
          trap 'rm -f "$RUNNER_TEMP/key.p12"' EXIT
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/key.p12" --ks-type PKCS12 --ks-key-alias carnet --ks-pass env:KS_PASS --key-pass env:KS_PASS --out tv-streamy.apk aligned.apk
          ls -la tv-streamy.apk

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/build_tizen.py "1.0.${{ github.run_number }}"
          cp dist/tv-streamy.wgt tv-streamy.wgt
          gh release create "v1.${{ github.run_number }}" tv-streamy.apk tv-streamy.wgt \
            --title "TV Streamy 1.${{ github.run_number }} ($APP_VERSION)" \
            --notes "Version du $APP_VERSION. tv-streamy.apk : téléphone, tablette et Android TV (ouvre-le pour installer ou mettre à jour). tv-streamy.wgt : TV Samsung (Tizen), à installer avec un outil comme Apps2Samsung ou Tizen Studio." \
            --latest
