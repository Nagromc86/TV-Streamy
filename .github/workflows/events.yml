name: Calendrier sportif

on:
  push:
    branches: [ main ]
    paths: [ 'tools/collect-events.js', '.github/workflows/events.yml' ]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/collect-events.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Rien de nouveau"; else git commit -m "Calendrier sportif mis à jour" && git pull --rebase -q && git push; fi
